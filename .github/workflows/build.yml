name: build rules

on:
  schedule:
    - cron: "0 19 * * *"   # UTC 19:00 = 鍖椾含鏃堕棿 03:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: build rules
        run: |
          echo '' | base64 -d > /tmp/build_all.py
          python /tmp/build_all.py
      - name: commit
        run: |
          git config user.name "anti-ad-bot"
          git config user.email "bot@users.noreply.github.com"
          git add anti-ad-73.txt anti-ad-50k.txt
          if git diff --staged --quiet; then echo "no change"; else git commit -m "update $(date -u +%F)"; git push; fi
